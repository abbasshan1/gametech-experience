<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameTech AI Consultant</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/mobile.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/os-ui.css">
    <link rel="stylesheet" href="../css/windows.css">
    <style>
        /* Standalone page layout so the full consultation + recommendation is always visible */
        body {
            margin: 0;
            background: #050505;
        }
        .dashboard {
            min-height: 100vh;
            padding: 24px 16px 60px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        #gtStandalone {
            width: 100%;
            max-width: 980px;
        }
        #gtStandalone .gt-ai {
            width: 100%;
            max-width: 980px;
            margin: 0 auto;
            padding: 8px 4px 40px;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div id="gtStandalone"></div>
    </div>

    <script>
        /*
          REMOTE AI (preferred for GitHub Pages / public visitors):
          1. On the PC that runs `npm start`, start a Cloudflare tunnel:
             ./cloudflared tunnel --url http://127.0.0.1:3000
          2. Paste the https://xxxxx.trycloudflare.com URL below.
          3. Leave empty ("") when the host is offline — UI will show
             "AI offline + WhatsApp" fallback (still usable).
        */
        window.GAME_TECH_API ="https://charged-doctrine-endangered-protecting.trycloudflare.com";   // e.g. "https://your-tunnel.trycloudflare.com"
    </script>
    <script src="../js/consultation.js"></script>
    <script src="../js/gametech-ai.js"></script>
    <script>
        // Same robust start used by the OS buttons
        document.getElementById("gtStandalone").innerHTML = getGameTechAI();
        requestAnimationFrame(() => {
            startGTBuildConsultation();
            const actions = document.getElementById("gtConsultationActions");
            if (actions) {
                actions.scrollIntoView({ behavior: "smooth", block: "nearest" });
            }
        });
    </script>
</body>
</html>
